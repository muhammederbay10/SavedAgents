# Alembic configuration. The database URL is not set here: migrations read
# DATABASE_URL through app/config.py, like the rest of the application.

[alembic]
script_location = %(here)s/app/db/migrations
prepend_sys_path = %(here)s
# Revision files get names that are valid Python module names.
file_template = rev_%%(rev)s_%%(slug)s
